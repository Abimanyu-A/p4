name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check backend tests
      - run: ruff format --check backend tests
      - run: pytest --cov=backend --cov-report=term-missing

  frontend:
    name: Frontend lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: p4:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/p4-image.tar
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          input: /tmp/p4-image.tar
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

  dogfood:
    name: Evaluate pipeline against ground truth
    runs-on: ubuntu-latest
    needs: [backend]
    # Forked PRs don't have access to repo secrets, so this gate only runs
    # where a GEMINI_API_KEY is actually configured (e.g. pushes to main).
    if: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run p4 evaluate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: p4 evaluate --min-precision 0.85 --min-recall 1.0
